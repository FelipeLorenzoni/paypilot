services:
  postgres:
    image: postgres:16-alpine
    container_name: paypilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-paypilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-paypilot}
      POSTGRES_DB: ${POSTGRES_DB:-paypilot}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - paypilot-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-paypilot} -d ${POSTGRES_DB:-paypilot}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  paypilot-postgres-data:
